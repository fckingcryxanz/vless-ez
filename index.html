<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Management</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="wrapper">
    
    <div class="header-panel">
        <div class="brand">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5v14M22 9v6M7 7v10M2 10v4"/></svg>
            Subscription
        </div>
        <div class="top-actions">
            <button class="btn-icon" id="copy-raw" title="Скопировать ссылку">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            </button>
            <button class="btn-icon" title="QR Код">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
            </button>
        </div>
    </div>

    <div class="main-card">
        <div class="user-profile">
            <div class="status-badge">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="user-details">
                <h3>BrawlStars_User</h3>
                <span>Истекает через 3 дня</span>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Имя пользователя</div>
                <div class="info-value" style="color: #38bdf8;">Brawl_DNS_Private</div>
            </div>
            <div class="info-item">
                <div class="info-label">Статус</div>
                <div class="info-value active-text">Активна</div>
            </div>
            <div class="info-item">
                <div class="info-label">Истекает</div>
                <div class="info-value" style="color: var(--accent-red);">04 июня, 2026</div>
            </div>
            <div class="info-item">
                <div class="info-label">Трафик</div>
                <div class="info-value">0 / ∞</div>
            </div>
        </div>
    </div>

    <div class="main-card">
        <div class="install-header">
            <div class="section-head">Установка</div>
            <!-- Выпадающий список систем без телевизоров -->
            <select class="os-select" id="os-dropdown">
                <option value="android">Android</option>
                <option value="ios">iOS</option>
                <option value="windows">Windows</option>
                <option value="linux">Linux</option>
                <option value="macos">macOS</option>
            </select>
        </div>
        
        <div class="tabs-container">
            <button class="tab-item active">FlClashX</button>
            <button class="tab-item">Koala Clash</button>
            <button class="tab-item">Prizrak-Box</button>
            <button class="tab-item">Happ</button>
        </div>

        <div class="action-container">
            <p id="instruction-text">Нажмите кнопку ниже — мобильное приложение автоматически откроется и загрузит вашу личную DNS-подписку.</p>
            <a href="#" id="happ-link" class="btn-main">Добавить подписку</a>
        </div>
    </div>

</div>

<script src="./script.js"></script>
</body>
</html>
