<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Management</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .wrapper { max-width: 720px !important; text-shadow: 0 0 10px rgba(56, 189, 248, 0.15); }
        .main-card { background-color: rgba(255, 255, 255, 0.08) !important; border: 1px solid rgba(56, 189, 248, 0.15) !important; backdrop-filter: blur(25px) !important; box-shadow: 0 0 30px rgba(56, 189, 248, 0.1) !important; }
        .guide-card { background-color: rgba(255, 255, 255, 0.04) !important; border: 1px solid rgba(255, 255, 255, 0.06) !important; }
        .info-item { background-color: rgba(255, 255, 255, 0.03) !important; border: 1px solid rgba(255, 255, 255, 0.05) !important; }
        .btn-action { background-color: rgba(56, 189, 248, 0.18) !important; color: #38bdf8 !important; border: 1px solid #38bdf8 !important; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4) !important; transition: 0.3s ease; }
        .btn-action:hover { background-color: #38bdf8 !important; color: #000 !important; box-shadow: 0 0 25px #38bdf8 !important; }
        .btn-submit { background-color: #0084ff !important; border: 1px solid #38bdf8 !important; box-shadow: 0 0 20px rgba(0, 132, 255, 0.6) !important; transition: 0.3s ease; }
        .btn-submit:hover { background-color: #0066cc !important; box-shadow: 0 0 30px #0084ff !important; }
        .guide-icon-box { box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body>

<div class="wrapper">
    
    <div class="header-panel">
        <div class="brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5v14M22 9v6M7 7v10M2 10v4"/></svg>
            Subscription
        </div>
        <div class="top-actions">
            <button class="btn-icon" id="copy-raw">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            </button>
        </div>
    </div>

    <div class="main-card">
        <div class="user-profile">
            <div class="status-badge">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="user-details">
                <h3>{{USER_CODE}}</h3>
                <span>Истекает через 3 дня</span>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Имя пользователя</div>
                <div class="info-value" id="dynamic-user-name" style="color: #38bdf8;">Loading...</div>
            </div>
            <div class="info-item">
                <div class="info-label">Статус</div>
                <div class="info-value active-text">Активна</div>
            </div>
            <div class="info-item">
                <div class="info-label">Истекает</div>
                <div class="info-value" style="color: var(--accent-red);">04 июня, 2026</div>
            </div>
            <div class="info-item">
                <div class="info-label">Трафик</div>
                <div class="info-value">0 / ∞</div>
            </div>
        </div>
    </div>

    <div class="main-card">
        <div class="card-title-bar">
            <div class="section-head">Установка</div>
            <select class="os-select" id="os-dropdown">
                <option value="android">Android</option>
                <option value="ios">iOS</option>
                <option value="windows">Windows</option>
                <option value="linux">Linux</option>
                <option value="macos">macOS</option>
            </select>
        </div>
        
        <div class="tabs-container">
            <div class="tab-item">Happ</div>
        </div>

        <div class="guide-list">
            <!-- Сюда бэкенд автоматически подставит файлы шагов -->
            {{STEP_1}}
            {{STEP_2}}
            {{STEP_3}}
        </div>
    </div>

</div>

<script>
    const userCode = "{{USER_CODE}}";
    const domain = "{{DOMAIN}}";
    const configUrl = domain + "/configs.txt?id=" + userCode;

    document.getElementById('dynamic-user-name').textContent = userCode;

    const osSelect = document.getElementById('os-dropdown');
    const osBtnText = document.getElementById('os-button-text');
    const downloadAppBtn = document.getElementById('download-app-btn');
    const happLink = document.getElementById('happ-link');

    if (happLink) happLink.href = "happ://sub/add/" + configUrl;

    const storeLinks = {
        android: "https://google.com",
        ios: "https://apple.com",
        windows: "https://github.com",
        linux: "https://github.com",
        macos: "https://github.com"
    };

    const storeNames = {
        android: "Google Play",
        ios: "App Store",
        windows: "Windows (GitHub)",
        linux: "Linux (GitHub)",
        macos: "macOS (GitHub)"
    };

    if (osSelect && osBtnText && downloadAppBtn) {
        osSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            osBtnText.textContent = storeNames[val];
            downloadAppBtn.href = storeLinks[val];
            
            if (val === 'ios') {
                happLink.href = "https://notjakob.com" + configUrl;
            } else {
                happLink.href = "happ://sub/add/" + configUrl;
            }
        });
    }

    document.getElementById('copy-raw').addEventListener('click', () => {
        navigator.clipboard.writeText(configUrl).then(() => {
            alert('Ссылка на подписку скопирована!');
        });
    });
</script>
</body>
</html>
